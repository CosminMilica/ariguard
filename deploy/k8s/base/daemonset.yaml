apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: statewall-agent
  namespace: statewall-system
  labels:
    app.kubernetes.io/name: statewall-agent
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: statewall-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: statewall-agent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: statewall-agent
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: statewall-agent:dev
          imagePullPolicy: IfNotPresent
          args:
            - --object=/opt/statewall/statewall.bpf.o
            - --bundle=/opt/statewall/policy.bin
            - --metrics-addr=:9102
          ports:
            - name: metrics
              containerPort: 9102
          securityContext:
            privileged: true
            capabilities:
              add: [BPF, PERFMON, SYS_ADMIN, SYS_RESOURCE, KILL]
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
