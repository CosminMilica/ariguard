apiVersion: v1
kind: ServiceAccount
metadata:
  name: ariguard-agent
  namespace: ariguard-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ariguard-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ariguard-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ariguard-agent
subjects:
  - kind: ServiceAccount
    name: ariguard-agent
    namespace: ariguard-system
