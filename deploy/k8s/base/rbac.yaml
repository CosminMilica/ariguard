apiVersion: v1
kind: ServiceAccount
metadata:
  name: statewall-agent
  namespace: statewall-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: statewall-agent
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: statewall-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: statewall-agent
subjects:
  - kind: ServiceAccount
    name: statewall-agent
    namespace: statewall-system
