apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Agent in enforce mode, pushing audit + register to the in-cluster console.
resources:
  - ../../base
patches:
  - target:
      kind: DaemonSet
      name: ariguard-agent
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --enforce
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --sink-url=http://ariguard-console-backend.ariguard-system.svc:8080
