# Lima VM for Statewall development on macOS.
# Ubuntu 24.04 ships kernel 6.8 with BTF and CONFIG_BPF_LSM=y — the baseline
# Statewall needs for eBPF CO-RE and BPF LSM enforcement.
#
#   limactl start --name=statewall deploy/lima/statewall.yaml   (or: make dev-up)
#   limactl shell statewall

vmType: "vz"

images:
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
    arch: "aarch64"
  - location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
    arch: "x86_64"

cpus: 4
memory: "4GiB"
disk: "40GiB"

# The repo is mounted writable so the VM builds against the same tree you edit on
# the host. Lima mounts host paths at the same path inside the guest, so $(CURDIR)
# works from the Makefile. Adjust the location if your checkout lives elsewhere.
mounts:
  - location: "~/work/statewall"
    writable: true

containerd:
  system: false
  user: false

provision:
  # Enable the BPF LSM at boot. CONFIG_BPF_LSM=y is not enough: `bpf` must be in
  # the active LSM list. This edits the kernel cmdline; a reboot is required
  # (handled by `make dev-up`, which restarts the VM after first provision).
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      if ! grep -q 'lsm=.*bpf' /proc/cmdline; then
        sed -i 's/\(GRUB_CMDLINE_LINUX_DEFAULT="[^"]*\)"/\1 lsm=landlock,lockdown,yama,integrity,apparmor,bpf"/' /etc/default/grub
        update-grub
        echo "BPF LSM added to kernel cmdline — reboot required."
      fi

  # System packages for eBPF / Rust / general builds.
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends \
        build-essential clang llvm pkg-config libelf-dev zlib1g-dev \
        linux-tools-common linux-tools-generic bpftool \
        docker.io ca-certificates curl git unzip
      usermod -aG docker "$(id -un 1000 2>/dev/null || echo ubuntu)" || true
      systemctl enable --now docker

  # Go, kind, kubectl, buf, protoc plugins (system-wide under /usr/local).
  - mode: system
    script: |
      #!/bin/bash
      set -euo pipefail
      ARCH="$(dpkg --print-architecture)"  # arm64 | amd64
      GO_VERSION=1.23.2
      curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-${ARCH}.tar.gz" | tar -C /usr/local -xz
      ln -sf /usr/local/go/bin/go /usr/local/bin/go
      ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
      KIND_ARCH="$ARCH"; [ "$ARCH" = "amd64" ] && KIND_ARCH="amd64"
      curl -fsSL -o /usr/local/bin/kind "https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-${KIND_ARCH}"
      chmod +x /usr/local/bin/kind
      curl -fsSL -o /usr/local/bin/kubectl "https://dl.k8s.io/release/v1.31.0/bin/linux/${ARCH}/kubectl"
      chmod +x /usr/local/bin/kubectl
      BUF_ARCH="$(uname -m)"
      curl -fsSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/latest/download/buf-Linux-${BUF_ARCH}"
      chmod +x /usr/local/bin/buf

  # Rust toolchain (per-user) with the eBPF target support.
  - mode: user
    script: |
      #!/bin/bash
      set -euo pipefail
      if ! command -v rustup >/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly
      fi
      source "$HOME/.cargo/env"
      rustup component add rust-src rustfmt clippy
      cargo install bpf-linker
      export PATH="/usr/local/go/bin:$PATH"
      go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
      go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest

probes:
  - script: |
      #!/bin/bash
      set -eux -o pipefail
      command -v go >/dev/null || exit 1
      command -v kind >/dev/null || exit 1
      test -f /sys/kernel/btf/vmlinux || exit 1
    hint: "Toolchain or BTF not ready; check `limactl shell statewall` and provisioning logs."
