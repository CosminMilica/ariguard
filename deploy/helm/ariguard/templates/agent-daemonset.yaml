apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ariguard-agent
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ariguard-agent
    {{- include "ariguard.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ariguard-agent
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ariguard-agent
        {{- include "ariguard.labels" . | nindent 8 }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9102"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: ariguard-agent
      hostPID: true
      tolerations:
        - operator: Exists
      containers:
        - name: agent
          image: {{ include "ariguard.image" (dict "root" . "name" .Values.agent.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --object=/opt/ariguard/ariguard.bpf.o
            - --bundle=/opt/ariguard/policy.bin
            - --metrics-addr=:9102
            {{- if .Values.agent.enforce }}
            - --enforce
            {{- end }}
            {{- if .Values.agent.deny }}
            - --deny
            {{- end }}
            {{- with include "ariguard.sinkUrl" . }}
            - --sink-url={{ . }}
            {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          ports:
            - name: metrics
              containerPort: 9102
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 3
            failureThreshold: 20
          {{- with .Values.agent.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            privileged: true
            capabilities:
              add: [BPF, PERFMON, SYS_ADMIN, SYS_RESOURCE, KILL]
          volumeMounts:
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: bpffs
              mountPath: /sys/fs/bpf
            - name: tracefs
              mountPath: /sys/kernel/tracing
              readOnly: true
            - name: debugfs
              mountPath: /sys/kernel/debug
              readOnly: true
      volumes:
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: bpffs
          hostPath:
            path: /sys/fs/bpf
        - name: tracefs
          hostPath:
            path: /sys/kernel/tracing
        - name: debugfs
          hostPath:
            path: /sys/kernel/debug
