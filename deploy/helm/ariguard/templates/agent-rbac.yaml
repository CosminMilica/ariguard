apiVersion: v1
kind: ServiceAccount
metadata:
  name: ariguard-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ariguard-agent
subjects:
  - kind: ServiceAccount
    name: ariguard-agent
    namespace: {{ .Values.namespace }}
