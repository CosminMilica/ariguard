apiVersion: v1
kind: ServiceAccount
metadata:
  name: ariguard-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
rules:
  # Read pod metadata cluster-wide for cgroup->pod resolution (podmeta polls Pods(AllNamespaces).List).
  # Always granted; carries no destructive power. See docs/agent-rbac.md.
  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch
      {{- if ne .Values.agent.isolate "off" }}
      # (un)label pods on quarantine / release. Only with autonomous isolation (agent.isolate != off).
      - patch
      {{- end }}
      {{- if eq .Values.agent.isolateFallback "evict" }}
      # Delete (evict) a quarantined pod. Only with agent.isolateFallback=evict.
      - delete
      {{- end }}
  {{- if eq .Values.agent.isolate "on" }}
  # Create the deny-all NetworkPolicy that quarantines a compromised pod. Only agent.isolate=on
  # applies one (dryrun only labels, so it never touches the networking API); the responder only
  # ever creates it (AlreadyExists is success), so no update/get/list/patch is needed.
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs:
      - create
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ariguard-agent
subjects:
  - kind: ServiceAccount
    name: ariguard-agent
    namespace: {{ .Values.namespace }}
