apiVersion: v1
kind: ServiceAccount
metadata:
  name: ariguard-agent
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "watch", "get", "patch"] # patch: label a pod on autonomous quarantine
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "create", "update"] # deny-all NetworkPolicy to isolate a compromised pod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ariguard-agent
  labels:
    {{- include "ariguard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ariguard-agent
subjects:
  - kind: ServiceAccount
    name: ariguard-agent
    namespace: {{ .Values.namespace }}
