{{- if .Values.console.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ariguard-console-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: ariguard-console-frontend
    {{- include "ariguard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ariguard-console-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ariguard-console-frontend
        {{- include "ariguard.labels" . | nindent 8 }}
    spec:
      containers:
        - name: frontend
          image: {{ include "ariguard.image" (dict "root" . "name" .Values.console.frontend.image) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          {{- with .Values.console.frontend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
