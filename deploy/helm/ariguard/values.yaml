image:
  registry: ghcr.io/cosminmilica
  # Empty means .Chart.AppVersion.
  tag: ""
  pullPolicy: IfNotPresent

namespace: ariguard-system

# Shared bearer token for the control plane: the console requires it on the agent-facing /api/v1
# endpoints (policy push/poll, register, audit, traces). Empty = disabled (dev). When set, it is
# stored in a Secret and injected as ARIGUARD_TOKEN into the console, agents and the rulegen job.
auth:
  token: ""

agent:
  image: ariguard-agent
  # true appends --enforce, false runs detect-only.
  enforce: true
  # true appends --deny: refuse deny-action syscalls with -EPERM via BPF LSM where a hook
  # exists (needs enforce and a kernel with BPF LSM active; falls back to kill otherwise).
  deny: false
  # Autonomous workload isolation on a confirmed terminal mitigation: off|dryrun|on.
  # "on" applies a deny-all NetworkPolicy to the compromised pod (needs a NetworkPolicy-
  # enforcing CNI); "dryrun" only labels it. Requires the RBAC in agent-rbac.yaml.
  isolate: "off"
  # Extra isolation for CNIs that ignore NetworkPolicy (e.g. kindnet): off|evict.
  # "evict" deletes the quarantined pod so its network is cut immediately (destructive;
  # a controller recreates it clean). Only applies with isolate: "on".
  isolateFallback: "off"
  # Empty with console.enabled defaults to the in-cluster console backend.
  sinkUrl: ""
  # Poll the console (control plane) for a newer policy bundle and hot-swap it without an image
  # rebuild (F7). Needs a sink URL. Set false to pin the agent to its baked-in bundle.
  policySync: true
  resources:
    requests:
      cpu: 50m
      memory: 64Mi

# Autonomous rule-generation loop (F11): a CronJob that mines the trace corpus + ingests community
# feeds, links a policy bundle (curated + generated enforced, mined rules shadow), reads per-rule
# telemetry from the console to promote/retire, and pushes the bundle to the control plane. Agents
# hot-swap it. CPU-only, no LLM. Off by default.
rulegen:
  enabled: false
  image: ariguard-rulegen
  # Hourly, off the top of the hour. A quiet loop: an unchanged bundle is a no-op push.
  schedule: "17 * * * *"
  # Optional directory of community Sigma rules baked into the image to ingest.
  feedsDir: ""
  # Empty defaults to the in-cluster console backend.
  consoleUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi

console:
  enabled: true
  storage:
    size: 1Gi
    # Empty uses the cluster default StorageClass.
    storageClassName: ""
  # none | nodePort | ingress
  expose: none
  nodePort: {}
  ingress:
    className: ""
    host: ariguard.local
    annotations: {}
    tls: []
  backend:
    image: ariguard-console-backend
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
  frontend:
    image: ariguard-console-frontend
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
