kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: statewall-dev
networking:
  # Fixed port so the host kubeconfig (make kubeconfig) stays valid across
  # re-creations; Lima forwards guest 127.0.0.1 ports to the host.
  apiServerAddress: "127.0.0.1"
  apiServerPort: 16443
nodes:
  - role: control-plane
