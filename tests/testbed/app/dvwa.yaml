# Real vulnerable target: DVWA (command injection = real HTTP RCE) + its MariaDB.
# Deployed privileged + hostPID so a www-data shell obtained through the web RCE can
# attempt a genuine container escape. This is the misconfiguration the escape exploits;
# the RCE itself is the application's own vulnerability, not something we script.
#
# NOT part of CI. Runs only in the isolated dev cluster (see tests/testbed/README.md).
apiVersion: v1
kind: Namespace
metadata:
  name: ariguard-testbed
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dvwa
  namespace: ariguard-testbed
  labels: {app: dvwa}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dvwa}
  template:
    metadata:
      labels: {app: dvwa}
    spec:
      hostPID: true
      containers:
        - name: db
          image: mariadb:10.11
          imagePullPolicy: IfNotPresent
          env:
            - {name: MARIADB_ROOT_PASSWORD, value: root}
            - {name: MARIADB_DATABASE, value: dvwa}
            - {name: MARIADB_USER, value: dvwa}
            - {name: MARIADB_PASSWORD, value: "p@ssw0rd"}
          readinessProbe:
            exec: {command: ["sh", "-c", "mariadb -udvwa -pp@ssw0rd -e 'select 1' dvwa"]}
            initialDelaySeconds: 5
            periodSeconds: 5
        - name: dvwa
          image: ghcr.io/digininja/dvwa:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /login.php, port: 80}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa
  namespace: ariguard-testbed
spec:
  selector: {app: dvwa}
  ports:
    - {port: 80, targetPort: 80}
