# Reverse-shell target: a command-injectable web app and an in-cluster "attacker" listener. The
# exploit makes the target open a socket back to the listener and hand it a shell -- the classic
# connect -> stdio-redirect -> shell kill-chain the reverse-shell rule watches. NOT part of CI.
apiVersion: v1
kind: ConfigMap
metadata:
  name: revshell-src
  namespace: ariguard-testbed
data:
  server.py: |
    import http.server, subprocess, urllib.parse
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            q = urllib.parse.parse_qs(u.query)
            if u.path == "/exec" and "cmd" in q:
                r = subprocess.run(["/bin/sh", "-c", q["cmd"][0]], capture_output=True, text=True)
                body = (r.stdout + r.stderr).encode()
            else:
                body = b"revshell-target: GET /exec?cmd=<shell>\n"
            self.send_response(200); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a):
            pass
    http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
  listener.py: |
    # The attacker's C2: accept the reverse-shell connection so the target's connect() succeeds.
    import socketserver
    class H(socketserver.BaseRequestHandler):
        def handle(self):
            try:
                self.request.sendall(b"id\n"); self.request.recv(256)
            except Exception:
                pass
    socketserver.ThreadingTCPServer(("0.0.0.0", 4444), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: revshell-target, namespace: ariguard-testbed, labels: {app: revshell-target}}
spec:
  replicas: 1
  selector: {matchLabels: {app: revshell-target}}
  template:
    metadata: {labels: {app: revshell-target}}
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          command: ["python3", "/src/server.py"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 2, periodSeconds: 2}
          volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: revshell-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: revshell-target, namespace: ariguard-testbed}
spec:
  selector: {app: revshell-target}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: attacker-listener, namespace: ariguard-testbed, labels: {app: attacker-listener}}
spec:
  replicas: 1
  selector: {matchLabels: {app: attacker-listener}}
  template:
    metadata: {labels: {app: attacker-listener}}
    spec:
      containers:
        - name: c2
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/src/listener.py"]
          ports: [{containerPort: 4444}]
          volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: revshell-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: attacker-listener, namespace: ariguard-testbed}
spec:
  selector: {app: attacker-listener}
  ports: [{port: 4444, targetPort: 4444}]
