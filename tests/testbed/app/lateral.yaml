---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-src
  namespace: ariguard-internal
data:
  db.py: |
    import socketserver
    class H(socketserver.BaseRequestHandler):
        def handle(self):
            self.request.recv(64)
            self.request.sendall(b"db-ok\n")
    socketserver.ThreadingTCPServer(("0.0.0.0", 5432), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ariguard-testbed
  labels: {app: frontend}
spec:
  replicas: 1
  selector: {matchLabels: {app: frontend}}
  template:
    metadata: {labels: {app: frontend}}
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          command: ["python3", "/src/server.py"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 2, periodSeconds: 2}
          volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: vuln-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: frontend, namespace: ariguard-testbed}
spec:
  selector: {app: frontend}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ariguard-internal
  labels: {app: backend}
spec:
  replicas: 1
  selector: {matchLabels: {app: backend}}
  template:
    metadata: {labels: {app: backend}}
    spec:
      containers:
        - name: app
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext: {runAsUser: 0}
          command: ["python3", "/src/server.py"]
          ports: [{containerPort: 8080}]
          readinessProbe: {httpGet: {path: /, port: 8080}, initialDelaySeconds: 2, periodSeconds: 2}
          volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: vuln-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: backend, namespace: ariguard-internal}
spec:
  selector: {app: backend}
  ports: [{port: 8080, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: ariguard-internal
  labels: {app: db}
spec:
  replicas: 1
  selector: {matchLabels: {app: db}}
  template:
    metadata: {labels: {app: db}}
    spec:
      containers:
        - name: db
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "/src/db.py"]
          ports: [{containerPort: 5432}]
          volumeMounts: [{name: src, mountPath: /src}]
      volumes: [{name: src, configMap: {name: db-src}}]
---
apiVersion: v1
kind: Service
metadata: {name: db, namespace: ariguard-internal}
spec:
  selector: {app: db}
  ports: [{port: 5432, targetPort: 5432}]
