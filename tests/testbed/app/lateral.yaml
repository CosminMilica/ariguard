# Lateral-movement target (F2): a three-tier app across two namespaces, so a real network pivot
# crosses a namespace boundary and shows up as an observed pod->pod edge.
#
#   ariguard-testbed/frontend (internet-facing, command injection, root)
#        │  connect
#        ▼
#   ariguard-internal/backend (internal "trusted" API, also command-injectable)
#        │  connect
#        ▼
#   ariguard-internal/db      (a plain TCP listener on 5432)
#
# The attacker lands RCE on the frontend, reaches the internal backend, and from the backend
# reaches the db -- two hops the agent observes as frontend->backend and backend->db network
# pivots (F2). NOT part of CI.
apiVersion: v1
kind: Namespace
metadata:
  name: ariguard-internal
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-src
  namespace: ariguard-testbed
data:
  server.py: |
    # Deliberately vulnerable: shells out with attacker-controlled input. Runs as root.
    import http.server, subprocess, urllib.parse
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            q = urllib.parse.parse_qs(u.query)
            if u.path == "/exec" and "cmd" in q:
                r = subprocess.run(["/bin/sh", "-c", q["cmd"][0]], capture_output=True, text=True)
                body = (r.stdout + r.stderr).encode()
            else:
                body = b"vuln: GET /exec?cmd=<shell>\n"
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass
    http.server.HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-src
  namespace: ariguard-internal
data:
  server.py: |
    # Deliberately vulnerable: shells out with attacker-controlled input. Runs as root.
    import http.server, subprocess, urllib.parse
    class H(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            u = urllib.parse.urlparse(self.path)
            q = urllib.parse.parse_qs(u.query)
