[workspace]
resolver = "2"
members = ["ariguard-ebpf", "ariguard-common"]

[profile.release]
# eBPF requires optimizations; the verifier rejects unoptimized output.
opt-level = 2
# BTF for the maps is generated from debug info (bpf-linker --btf).
debug = 2
lto = true
codegen-units = 1
panic = "abort"
