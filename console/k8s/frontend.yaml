apiVersion: apps/v1
kind: Deployment
metadata:
  name: ariguard-console-frontend
  namespace: ariguard-system
  labels:
    app.kubernetes.io/name: ariguard-console-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ariguard-console-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ariguard-console-frontend
    spec:
      containers:
        - name: frontend
          image: ariguard-console-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ariguard-console-frontend
  namespace: ariguard-system
spec:
  selector:
    app.kubernetes.io/name: ariguard-console-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
