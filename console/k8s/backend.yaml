apiVersion: apps/v1
kind: Deployment
metadata:
  name: ariguard-console-backend
  namespace: ariguard-system
  labels:
    app.kubernetes.io/name: ariguard-console-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ariguard-console-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ariguard-console-backend
    spec:
      containers:
        - name: backend
          image: ariguard-console-backend:dev
          imagePullPolicy: IfNotPresent
          args: ["--addr", ":8080", "--db", "/data/ariguard-console.db"]
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ariguard-console-db
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ariguard-console-db
  namespace: ariguard-system
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ariguard-console-backend
  namespace: ariguard-system
spec:
  selector:
    app.kubernetes.io/name: ariguard-console-backend
  ports:
    - name: http
      port: 8080
      targetPort: http
