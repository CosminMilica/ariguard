server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API goes to the backend service; browser sees a single origin.
    location /api/ {
        proxy_pass http://ariguard-console-backend:8080;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
