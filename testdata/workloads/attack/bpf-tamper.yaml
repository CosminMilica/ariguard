# Attack: bpf tampering (T1562.001). bpf(MAP_CREATE) then bpf(PROG_LOAD).
apiVersion: v1
kind: Pod
metadata: {name: bpf-tamper, namespace: ariguard-eval, labels: {app.kubernetes.io/part-of: ariguard-eval}}
spec:
  restartPolicy: Never
  containers:
    - name: attacker
      image: python:3.12-slim
      securityContext: {privileged: true}
      command: ["python3","-c"]
      args:
        - |
          import ctypes, time
          time.sleep(8)
          libc = ctypes.CDLL(None)
          libc.syscall(280, 0, 0, 0)   # bpf(BPF_MAP_CREATE) arm64
          libc.syscall(280, 5, 0, 0)   # bpf(BPF_PROG_LOAD)  (terminal -> kill)
          time.sleep(10)
