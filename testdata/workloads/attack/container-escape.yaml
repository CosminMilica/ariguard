# Attack: container-escape chain, all steps in one container (one cgroup).
# Expected FSM path:
#   normal -(openat containerd.sock)-> suspicious -(setns)-> escalating
#   -(mount)-> breakout_imminent -(execve)-> compromised
# Under --deny the mount is refused with -EPERM, so the chain halts at breakout_imminent
# and the terminal execve/kill never runs; under kill-only enforcement the mount succeeds
# and the execve is killed at compromised.
# Harmless: the socket is only opened (ENXIO), nsenter runs `true`, the tmpfs is container-local.
# LIBMOUNT_FORCE_MOUNT2 makes util-linux use mount(2) instead of the new fsopen/fsmount API.
apiVersion: v1
kind: Pod
metadata:
  name: container-escape
  namespace: ariguard-eval
  labels:
    app: container-escape
    app.kubernetes.io/part-of: ariguard-eval
spec:
  restartPolicy: Never
  hostPID: true
  containers:
    - name: attacker
      image: ubuntu:24.04
      securityContext:
        privileged: true
      env:
        - name: LIBMOUNT_FORCE_MOUNT2
          value: always
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "warmup: let the agent resolve this pod's cgroup before the chain"
          sleep 8
          echo "step 1: open runtime socket"
          cat /run/containerd/containerd.sock > /dev/null 2>&1 || true
          sleep 1
          echo "step 2: setns"
          nsenter --target 1 --mount -- true || echo "nsenter failed"
          sleep 1
          echo "step 3: mount"
          if mount -t tmpfs tmpfs /mnt; then
            echo "step 4: execve (terminal step runs in the main process so a kill fails the pod)"
            exec /bin/true
          else
            # Refused with -EPERM: stop here. Any execve now (even `sleep`) would be the
            # critical_execve terminal and get killed, so exit via the shell builtin only.
            echo "mount denied (-EPERM): host mount refused, escape blocked at breakout_imminent"
            exit 7
          fi
      volumeMounts:
        - name: containerd-sock
          mountPath: /run/containerd/containerd.sock
  volumes:
    - name: containerd-sock
      hostPath:
        path: /run/containerd/containerd.sock
        type: Socket
