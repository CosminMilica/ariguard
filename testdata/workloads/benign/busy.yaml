# Benign: file churn and frequent exec (find/cat/tar loops).
# Exercises many openat and execve calls on ordinary paths; no chain step fires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busy
  namespace: statewall-eval
  labels:
    app.kubernetes.io/part-of: statewall-eval
spec:
  replicas: 1
  selector:
    matchLabels:
      app: busy
  template:
    metadata:
      labels:
        app: busy
        app.kubernetes.io/part-of: statewall-eval
    spec:
      containers:
        - name: busy
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                find / -xdev -type f 2>/dev/null | head -n 500 > /dev/null
                for i in $(seq 1 50); do
                  echo "$i" > "/work/f$i"
                  cat "/work/f$i" > /dev/null
                done
                tar -cf /tmp/work.tar -C /work .
                mkdir -p /tmp/extract
                tar -xf /tmp/work.tar -C /tmp/extract
                rm -rf /tmp/extract /tmp/work.tar /work/f*
                sleep 1
              done
          volumeMounts:
            - name: work
              mountPath: /work
      volumes:
        - name: work
          emptyDir: {}
