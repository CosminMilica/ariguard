name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUFF_VERSION: "0.17.3"
  PIP_AUDIT_VERSION: "2.10.1"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  BUF_VERSION: "1.75.0"
  CARGO_DENY_VERSION: "0.20.2"
  GITLEAKS_VERSION: "8.30.1"
  GOVULNCHECK_VERSION: "v1.9.0"
  VIMTO_VERSION: "v0.4.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          python: "true"
          pip-packages: ruff==${{ env.RUFF_VERSION }}
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true
      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - run: make ci-hygiene

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          python: "true"
          pip-packages: pytest pytest-cov
      - run: make ci-unit

  contract:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          python: "true"
      - uses: bufbuild/buf-action@v1.6.0
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - run: make ci-contract

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust: "true"
          python: "true"
          pip-packages: pip-audit==${{ env.PIP_AUDIT_VERSION }}
      - name: Install scanners
        run: |
          go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"
          curl -fsSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C "$HOME/.cargo/bin" "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
      - run: make ci-security

  bpf:
    name: Build BPF
    needs: [lint, unit, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          bpf-linker: "true"
      - run: make ci-bpf
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: bpf-object
          path: bin/statewall.bpf.o
          retention-days: 7
          if-no-files-found: error

  kernel:
    name: Kernel ${{ matrix.kernel }}
    needs: bpf
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        kernel: ["5.15", "6.1", "6.6", "6.12", "7.0", "stable", "host"]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8.0.2
        with:
          name: bpf-object
          path: bin
      - name: Install vimto
        if: matrix.kernel != 'host'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86
          sudo chmod 0666 /dev/kvm
          CGO_ENABLED=0 go install "lmb.io/vimto@${VIMTO_VERSION}"
      - name: Integration tests in a VM
        if: matrix.kernel != 'host'
        run: make ci-kernel KERNEL=${{ matrix.kernel }}
      - name: Integration tests on the runner kernel
        if: matrix.kernel == 'host'
        run: make ci-kernel-host

  e2e:
    name: End-to-end
    needs: bpf
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup
        with:
          python: "true"
          bpf-linker: "true"
      - uses: helm/kind-action@v1.15.1
        with:
          cluster_name: statewall-dev
          config: deploy/kind/cluster.yaml
      - name: Phase 1 exit check
        env:
          TMPDIR: ${{ runner.temp }}/exit-check
        run: |
          mkdir -p "$TMPDIR"
          make ci-e2e
      - name: Diagnostics
        if: failure()
        run: |
          uname -a
          stat -fc 'cgroup fs: %T' /sys/fs/cgroup
          echo "runner cgroup: $(cat /proc/self/cgroup)"
          docker info --format 'docker cgroup: {{.CgroupDriver}} v{{.CgroupVersion}}'
          docker exec statewall-dev-control-plane cat /proc/1/cgroup
          node_pid="$(docker inspect -f '{{.State.Pid}}' statewall-dev-control-plane)"
          echo "kind node cgroup: $(cat "/proc/${node_pid}/cgroup")"
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: e2e-audit
          path: ${{ runner.temp }}/exit-check
          retention-days: 7

  ci:
    name: CI
    if: always()
    needs: [lint, unit, contract, security, bpf, kernel, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summary
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "## Verification gates"
            echo
            echo "| Gate | Job | Result |"
            echo "|---|---|---|"
            for row in "G0:lint:Lint" "G1:unit:Unit tests" "G2:contract:Contracts" "G3:bpf:Build BPF" \
                       "G4:kernel:Kernel matrix" "G5:e2e:End-to-end" "G6:security:Security"; do
              IFS=: read -r gate id label <<<"$row"
              result="$(jq -r --arg id "$id" '.[$id].result' <<<"$RESULTS")"
              case "$result" in
                success) icon="✅ pass" ;; failure) icon="❌ fail" ;;
                cancelled) icon="🚫 cancelled" ;; *) icon="⏭️ $result" ;;
              esac
              echo "| $gate | $label | $icon |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if jq -e 'to_entries | any(.value.result != "success")' <<<"$RESULTS" >/dev/null; then
            echo "::error::One or more gates did not pass"
            exit 1
          fi
