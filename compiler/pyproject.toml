[project]
name = "ariguard-compiler"
version = "0.1.0"
description = "Compile threat intelligence (ATT&CK / Sigma / syscall traces) into AriGuard in-kernel FSM transition tables."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ariguard-compile = "ariguard_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.coverage.run]
# ingest_attack.py fetches the ATT&CK STIX bundle over the network and writes the technique
# catalog — an IO entry-point script, not unit-testable without mocking the whole fetch; it is
# exercised functionally by `make ingest`.
omit = ["ariguard_compiler/ingest_attack.py"]
