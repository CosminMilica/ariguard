[project]
name = "ariguard-compiler"
version = "0.1.0"
description = "Compile threat intelligence (ATT&CK / Sigma / syscall traces) into AriGuard in-kernel FSM transition tables."
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
ariguard-compile = "ariguard_compiler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
