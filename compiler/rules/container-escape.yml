# Container-escape kill chain (see README.md).
# open runtime socket -> setns/unshare -> mount -> execve -> compromised.
name: container-escape
window_seconds: 30
states: [normal, suspicious, escalating, breakout_imminent, compromised]
events:
  runtime_socket_open:
    hooks: [openat]
    path_prefix: [/run/containerd/containerd.sock, /var/run/docker.sock, /run/docker.sock]
  namespace_manipulation:
    hooks: [setns, unshare]
  host_mount:
    hooks: [mount]
  critical_execve:
    hooks: [execve]
transitions:
  - from: normal
    event: runtime_socket_open
    to: suspicious
    action: observe

  - from: suspicious
    event: namespace_manipulation
    to: escalating
    action: throttle

  - from: escalating
    event: host_mount
    to: breakout_imminent
    action: deny

  - from: breakout_imminent
    event: critical_execve
    to: compromised
    action: kill
